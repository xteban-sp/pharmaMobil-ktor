# Autonoma 11, escenario 5 (parte 4): se vuelve a iniciar sesion y, al abrir el
# inventario, el pendiente que quedo con el token vencido se envia.
appId: ${APP_ID}
---
- runFlow:
    file: login.yaml
    env:
      USUARIO: admin
      CLAVE: Admin123
- tapOn: ".*Inventario, precios y stock.*"
- extendedWaitUntil:
    visible: "Inventario al día"
    timeout: 60000
- assertNotVisible: ".*Pendiente.*"
- scrollUntilVisible:
    element: "Ranitidina 150mg.*"
    direction: DOWN
    timeout: 20000
- takeScreenshot: a17-esc5-pendiente-enviado-tras-volver-a-entrar

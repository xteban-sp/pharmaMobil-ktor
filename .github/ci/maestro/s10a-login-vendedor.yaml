# S10 autonoma: deja al vendedor con la sesion abierta, en la lista de productos.
appId: ${APP_ID}
---
- launchApp:
    stopApp: true
- runFlow:
    file: login.yaml
    env:
      USUARIO: vendedor
      CLAVE: Vendedor123
- tapOn: ".*Inventario, precios y stock.*"
- extendedWaitUntil:
    visible: ".*Paracetamol 500mg.*"
    timeout: 60000
- takeScreenshot: e05-${PLATAFORMA}-vendedor-antes-de-deshabilitarlo

# Actividad autonoma 9: pantalla «Acerca de» (tercera capacidad nativa,
# InfoDispositivo) y el formato de moneda de la plataforma.
appId: ${APP_ID}
---
- launchApp:
    stopApp: true
    arguments:
      pantalla: acerca
# Si el argumento de arranque no llego, se entra por el menu lateral.
- runFlow:
    when:
      notVisible: "Entre S/ y el monto"
    commands:
      - tapOn: "Abrir menú"
      - tapOn: "Acerca de"
- extendedWaitUntil:
    visible: "Entre S/ y el monto"
    timeout: 60000
- takeScreenshot: m04-android-acerca-de
- scroll
- takeScreenshot: m05-android-acerca-de-final

# =====================================================================
# Perfil h2: levanta PharmaSoft sin Oracle, con una base H2 en memoria.
# Uso:  mvnw spring-boot:run -Dspring-boot.run.profiles=h2
#
# - El esquema lo genera Hibernate a partir de las entidades (create-drop):
#   la migracion V1 de Flyway esta escrita para Oracle y no se ejecuta aqui.
# - Al arrancar se cargan datos de ejemplo desde data-h2.sql.
# - Los datos se pierden al detener el servidor (base en memoria).
# =====================================================================
spring:
  datasource:
    url: jdbc:h2:mem:pharmadb;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    # Crea las tablas ANTES de ejecutar data-h2.sql
    defer-datasource-initialization: true
    show-sql: false
  sql:
    init:
      mode: always
      data-locations: classpath:data-h2.sql
  flyway:
    enabled: false
  h2:
    console:
      enabled: true
      path: /h2-console

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    enabled: true

logging:
  level:
    root: INFO
    pe.edu.upeu.PharmaBackend: DEBUG

app:
  cors:
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173,http://localhost:4200

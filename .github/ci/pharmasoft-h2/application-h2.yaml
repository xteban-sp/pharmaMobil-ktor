# =====================================================================
# Perfil h2: levanta PharmaSoft sin Oracle, con una base H2 en memoria.
# Uso:  mvnw spring-boot:run -Dspring-boot.run.profiles=h2
#
# - Flyway arma la base con las migraciones de db/migration-h2: las mismas
#   tablas que db/migration (Oracle), mas datos de ejemplo (V4).
# - Usuarios de prueba: admin/Admin123, vendedor/Vendedor123, almacen/Almacen123.
# - Los datos se pierden al detener el servidor (base en memoria).
# =====================================================================
spring:
  datasource:
    url: jdbc:h2:mem:pharmadb;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      # Igual que en dev: el esquema lo crea Flyway y Hibernate solo valida.
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration-h2
  h2:
    console:
      enabled: true
      path: /h2-console

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    enabled: true

logging:
  level:
    root: INFO
    pe.edu.upeu.PharmaBackend: DEBUG

app:
  cors:
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173,http://localhost:4200
  # Mismos valores que el perfil dev. Clave solo para desarrollo.
  jwt:
    secret: ILPEwcQMZU9TnjpXzv/hRWNoC9n1Imz+nPTBwMZH7TBX9n7f7XagfIgD7LhCEFZNclj1zxfx9FbVvbpfH45HOA==
    expiracion-minutos: 60
